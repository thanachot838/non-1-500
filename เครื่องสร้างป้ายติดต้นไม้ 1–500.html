<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องสร้างป้ายติดต้นไม้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3f1ea;
    --panel: #ffffff;
    --ink: #2b2a26;
    --muted: #6d6a60;
    --line: #d9d5c8;
    --accent: #4f8a3c;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1f1b; --panel: #272a25; --ink: #eceadf; --muted: #a5a294; --line: #3b3e37; --accent: #7fbf68; --accent-ink: #14210f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1f1b; --panel: #272a25; --ink: #eceadf; --muted: #a5a294; --line: #3b3e37; --accent: #7fbf68; --accent-ink: #14210f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* ---------- control panel ---------- */
  .panel {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end;
  }
  .panel h1 { font-size: 18px; margin: 0; width: 100%; font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  .field input[type=number], .field select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 110px;
  }
  .field input:focus-visible, .field select:focus-visible, button:focus-visible, .check input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); padding-bottom: 9px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  button.print {
    font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
  }
  button.print:hover { filter: brightness(1.06); }
  .info { font-size: 13px; color: var(--muted); padding-bottom: 10px; }
  .error { color: #c0392b; font-size: 13px; width: 100%; min-height: 1em; }

  /* ---------- sheets ---------- */
  .sheets { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .page {
    width: 210mm; height: 297mm; background: #fff; position: relative;
    box-shadow: 0 2px 14px rgba(0,0,0,.18);
    display: grid; grid-template-columns: repeat(3, 58mm); grid-auto-rows: 90mm;
    justify-content: center; align-content: center; gap: 4mm;
    zoom: 0.55;
  }
  @media (max-width: 700px) { .page { zoom: 0.4; } }
  @media (min-width: 1200px) { .page { zoom: 0.8; } }

  /* ---------- tag ---------- */
  .tag {
    --band: #5c9a4a; --body1: #cfe7bd; --body2: #b6d9a0; --ring: #5c9a4a;
    position: relative; width: 58mm; height: 90mm; border-radius: 4mm; overflow: hidden;
    background: linear-gradient(170deg, var(--body1), var(--body2));
    color: #2b2a26; display: flex; flex-direction: column;
  }
  .tag.c2 { --band: #e2b32a; --body1: #fbe7a0; --body2: #f6d96f; --ring: #d9a521; }
  .tag.c3 { --band: #e8905a; --body1: #f9d3b9; --body2: #f4b894; --ring: #e07f48; }
  .tag.cut { outline: 0.2mm dashed #9a9a9a; outline-offset: 0; }
  .band { height: 13mm; background: var(--band); position: relative; flex: none; }
  .hole {
    position: absolute; left: 50%; top: 5mm; width: 4.2mm; height: 4.2mm; margin-left: -2.1mm;
    border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 0.35mm rgba(0,0,0,.28);
  }
  .hole.off { display: none; }
  .title { text-align: center; font-size: 4.3mm; font-weight: 500; color: #6b6b63; margin-top: 4mm; line-height: 1; }
  .circle {
    width: 29mm; height: 29mm; border-radius: 50%; background: #fff;
    border: 0.7mm solid var(--ring); margin: 3.5mm auto 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #2d2b27; line-height: 1; flex: none;
  }
  .circle.d1 { font-size: 20mm; }
  .circle.d2 { font-size: 17mm; }
  .circle.d3 { font-size: 13mm; }
  .fields { padding: 3.5mm 5mm 0; display: flex; flex-direction: column; gap: 1.2mm; }
  .lbl { font-size: 4.4mm; font-weight: 500; line-height: 1.15; }
  .line { display: flex; align-items: flex-end; gap: 1.5mm; height: 6.5mm; font-size: 4.2mm; }
  .line i { flex: 1; border-bottom: 0.35mm solid #2b2a26; height: 100%; }
  .line span { line-height: 1.2; padding-bottom: 0.2mm; }

  /* ---------- print ---------- */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    .panel { display: none; }
    body { background: #fff; }
    .sheets { padding: 0; gap: 0; display: block; }
    .page { zoom: 1; box-shadow: none; break-after: page; page-break-after: always; margin: 0; }
    .page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>

<header class="panel">
  <h1>สร้างป้ายติดต้นไม้ สำหรับพิมพ์</h1>

  <label class="field">เริ่มที่เลข
    <input id="from" type="number" min="1" max="500" value="1" inputmode="numeric">
  </label>
  <label class="field">ถึงเลข
    <input id="to" type="number" min="1" max="500" value="27" inputmode="numeric">
  </label>
  <label class="field">สีป้าย
    <select id="color">
      <option value="cycle">วนสี เขียว → เหลือง → ส้ม</option>
      <option value="1">เขียวอ่อนทั้งหมด</option>
      <option value="2">เหลืองอ่อนทั้งหมด</option>
      <option value="3">ส้มอ่อนทั้งหมด</option>
      <option value="range">แบ่งตามช่วงเลข (1–166 / 167–333 / 334–500)</option>
    </select>
  </label>
  <label class="check"><input id="cut" type="checkbox" checked> เส้นประสำหรับตัด</label>
  <label class="check"><input id="hole" type="checkbox" checked> วงกลมรูเจาะ</label>
  <button class="print" id="printBtn" type="button">พิมพ์ / บันทึกเป็น PDF</button>
  <div class="info" id="info"></div>
  <div class="error" id="err" role="alert"></div>
</header>

<main class="sheets" id="sheets"></main>

<script>
(function () {
  var PER_PAGE = 9;
  var $ = function (id) { return document.getElementById(id); };
  var fromEl = $('from'), toEl = $('to'), colorEl = $('color'),
      cutEl = $('cut'), holeEl = $('hole'), sheets = $('sheets'),
      info = $('info'), err = $('err');

  function colorFor(n, mode) {
    if (mode === 'cycle') return ((n - 1) % 3) + 1;
    if (mode === 'range') return n <= 166 ? 1 : (n <= 333 ? 2 : 3);
    return parseInt(mode, 10);
  }

  function tagHTML(n, mode) {
    var d = String(n).length;
    return '<div class="tag c' + colorFor(n, mode) + (cutEl.checked ? ' cut' : '') + '">' +
      '<div class="band"><div class="hole' + (holeEl.checked ? '' : ' off') + '"></div></div>' +
      '<div class="title">ป้ายติดต้นไม้</div>' +
      '<div class="circle d' + d + '">' + n + '</div>' +
      '<div class="fields">' +
        '<div class="lbl">ความสูง</div>' +
        '<div class="line"><i></i><span>ม.</span></div>' +
        '<div class="lbl">เส้นผ่านศูนย์กลาง</div>' +
        '<div class="line"><i></i><span>ซม.</span></div>' +
      '</div></div>';
  }

  function render() {
    var a = parseInt(fromEl.value, 10), b = parseInt(toEl.value, 10);
    err.textContent = '';
    if (isNaN(a) || isNaN(b)) { err.textContent = 'กรอกเลขเริ่มต้นและเลขสุดท้าย'; sheets.innerHTML = ''; info.textContent = ''; return; }
    a = Math.min(500, Math.max(1, a));
    b = Math.min(500, Math.max(1, b));
    if (a > b) { err.textContent = 'เลขเริ่มต้นต้องไม่มากกว่าเลขสุดท้าย (ช่วงที่ใช้ได้ 1–500)'; sheets.innerHTML = ''; info.textContent = ''; return; }

    var mode = colorEl.value, html = '', count = b - a + 1;
    for (var n = a; n <= b; n++) {
      if ((n - a) % PER_PAGE === 0) html += '<section class="page">';
      html += tagHTML(n, mode);
      if ((n - a) % PER_PAGE === PER_PAGE - 1 || n === b) html += '</section>';
    }
    sheets.innerHTML = html;
    info.textContent = count + ' ป้าย · ' + Math.ceil(count / PER_PAGE) + ' หน้า A4 (หน้าละ 9 ป้าย ขนาด 58×90 มม.)';
  }

  [fromEl, toEl].forEach(function (el) { el.addEventListener('input', render); });
  colorEl.addEventListener('change', render);
  cutEl.addEventListener('change', render);
  holeEl.addEventListener('change', render);
  $('printBtn').addEventListener('click', function () { if (!err.textContent) window.print(); });

  render();
})();
</script>
</body>
</html>
